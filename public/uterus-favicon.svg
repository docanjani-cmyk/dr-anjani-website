<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Light lavender background -->
  <rect width="200" height="200" fill="#ECE7F5" rx="40"/>

  <!-- Uterus body -->
  <path d="M 64,98
           Q 64,64 100,64
           Q 136,64 136,98
           L 134,120
           Q 132,132 122,137
           L 121,155
           L 79,155
           L 78,137
           Q 68,132 66,120
           Z"
        fill="none" stroke="#9178BE" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left fallopian tube: from uterus shoulder, arcs out-up then hooks down -->
  <path d="M 65,93
           C 52,82 36,80 28,88
           C 18,98 22,114 30,120"
        fill="none" stroke="#9178BE" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Left ovary -->
  <ellipse cx="27" cy="129" rx="9" ry="12"
           fill="none" stroke="#9178BE" stroke-width="8"/>

  <!-- Right fallopian tube -->
  <path d="M 135,93
           C 148,82 164,80 172,88
           C 182,98 178,114 170,120"
        fill="none" stroke="#9178BE" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Right ovary -->
  <ellipse cx="173" cy="129" rx="9" ry="12"
           fill="none" stroke="#9178BE" stroke-width="8"/>
</svg>
